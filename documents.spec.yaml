# Program Charter v0.2: the documents and their formats
# Each part of the charter can be written at summary depth inside the charter,
# or as its own document in the format below. Only the one-pager, the charter
# itself, and the review note are required. Everything else is written when a
# named reader asks for it.
# Blank templates in formats/ and the walkthrough DOCUMENTS.md are generated
# from this file by build.py.

documents:

  - id: one_pager
    part: all
    title: "<Program name>: one page"
    required: always
    reader: anyone; the primary artifact
    length: 1 page
    updated: at every review
    sections:
      - {id: masthead,   title: "Masthead", prompt: "Box. Lead, sponsor, people with time fractions, envelope, end, next review, what is on offer, version."}
      - {id: goal,       title: "Goal", prompt: "The goal sentence, in plain words."}
      - {id: space,      title: "The space in three lines", prompt: "Name. What is inside and outside. Why now."}
      - {id: positions,  title: "Where we stand", prompt: "Our side of each crux, one line each."}
      - {id: premises,   title: "What has to be true", prompt: "Three to five premises, one line each, each ending with the result that would make us drop it."}
      - {id: end_state,  title: "What exists at the end", prompt: "What will exist that does not exist now, next to the baseline it has to beat."}
      - {id: next,       title: "Next 90 days", prompt: "Three commitments with an owner and a date."}
      - {id: ask,        title: "The ask and the offer", prompt: "What we need from the reader. What the reader can get from us."}
    checks:
      - a stranger can say back the goal and one premise after two minutes
      - no adjective without a number or a source
      - fits on one page without shrinking the type
    failures:
      - a mission statement where the goal sentence should be
      - premises that could not be false

  - id: space
    part: space
    title: "Opportunity Space: <name>"
    required: "inside the charter as one page. Standalone only when a second program or an outside organisation shares the space."
    reader: the field, including competitors
    length: 3 to 5 pages
    updated: when the landscape or a crux moves
    sections:
      - {id: boundary,   title: "Name and boundary", prompt: "The name. What is inside, what is outside, which neighbouring spaces it touches."}
      - {id: matters,    title: "Why it matters", prompt: "Who gains or loses what if this space develops well or badly. Magnitudes with sources."}
      - {id: why_now,    title: "Why now", prompt: "Three trends at most. Each with the evidence that it is real."}
      - {id: shared,     title: "Shared beliefs", prompt: "Short list of claims most of the field accepts. Keep it short; these orient nobody on their own."}
      - {id: cruxes,     title: "Cruxes", prompt: "Two to five contested claims, stated neutrally. For each: the claim, the strongest case for, the strongest case against, and what evidence would move it."}
      - {id: landscape,  title: "Landscape", prompt: "Table: who is here, what they cover, what they left open, how their work and ours connect."}
      - {id: asset,      title: "Shared assets", prompt: "What others can use today: an arena, a benchmark, a dataset, a convening, money. How to get access."}
      - {id: seeds,      title: "Seeds", prompt: "Questions in the space that sit outside any program. Small, exploratory, unowned."}
      - {id: steward,    title: "Steward and citation", prompt: "Who maintains this document, how to cite it, version."}
    checks:
      - no "we" outside the shared assets and steward sections
      - each crux names someone who holds each side, or cites them
      - a competitor could publish it under their own name changing only the steward
    failures:
      - beliefs everyone accepts presented as insight
      - our thesis smuggled in as a fact about the world
      - a landscape that lists nobody doing better work than us

  - id: thesis
    part: thesis
    title: "Program Thesis: <program name>"
    required: inside the charter at summary depth. Standalone when a funder or peer reviewer asks.
    reader: funders, peers, prospective collaborators
    length: 3 to 4 pages
    updated: on a version bump; a falsified premise forces one
    sections:
      - {id: simply,      title: "Simply stated", prompt: "200 words, no jargon. Ends with what is not in scope."}
      - {id: example,     title: "Worked example", prompt: "One concrete case, carried through the rest of the document and the open problems."}
      - {id: positions,   title: "Positions", prompt: "Our side of each crux in the space, and why."}
      - {id: premises,    title: "Premises", prompt: "For the goal to be true, these have to be true. For each: the statement, why we believe it, the result that would make us drop it, and the area of open problems it generates."}
      - {id: end_state,   title: "Success at the end", prompt: "What exists at the end of the term that does not exist now, and how anyone would check."}
      - {id: baseline,    title: "Baseline", prompt: "How this is done today, by whom, and the thing we have to beat."}
      - {id: why_us,      title: "Why us", prompt: "Evidence, not adjectives."}
      - {id: scope,       title: "Not in scope", prompt: "What a reader might assume we are doing and we are not."}
      - {id: transition,  title: "Transition", prompt: "Who receives the result, and what they would need to see to accept it."}
      - {id: unknowns,    title: "What we are still trying to figure out", prompt: "The questions about the program itself we would most like a reader to argue with."}
      - {id: log,         title: "Update log", prompt: "Version, date, what changed and why."}
    checks:
      - a reasonable peer could disagree with every position
      - every premise has a drop condition written before the work started
      - "covers the classic questions: what are you trying to do, how is it done today, what is new, who cares, what are the risks, what are the exams (cost and time live in the terms and the roadmap)"
    failures:
      - premises that are restatements of the goal
      - the why-us section made of credentials instead of results
      - success at the end described as activity instead of a thing that exists

  - id: open_problems
    part: open_problems
    title: "Open Problems in <space>"
    required: the question list is required inside the charter. The standalone public document is written when there is something on offer to outsiders.
    reader: outside researchers and builders
    length: as long as the list needs; one paragraph per area, one card per question
    updated: at every review; ids are never renumbered or reused
    sections:
      - {id: how_to_use,  title: "How to use this document", prompt: "What is on offer, how to claim a question, who to contact."}
      - {id: map,         title: "The map", prompt: "The tree as a figure: questions and capabilities as nodes, requires as edges, status and who is on each node."}
      - {id: areas,       title: "Areas", prompt: "One paragraph each: the input, the output, which premise it serves, or that it is cross-cutting."}
      - {id: questions,   title: "Questions", prompt: "One card per question, grouped by area. Format below."}
      - {id: hazards,     title: "Hazards", prompt: "Questions that should be sequenced defensively or not accelerated, and why."}
      - {id: contribute,  title: "Contributing and credit", prompt: "How an answer is submitted, how the list changes in response, how credit is given."}
      - {id: changes,     title: "Change log", prompt: "Questions added, answered, retired. Dates."}
    sub_formats:
      question_card:
        id:                 "stable, never renumbered"
        question:           one sentence
        serves:             the premise or area it belongs to
        answer_looks_like:  what would count as an answer
        first_step:         the smallest useful contribution
        status:             "open | being worked | answered | retired"
        prior_work:         links
        skill_to_start:     what someone needs to know
        who_is_on_it:       names, may include outsiders
        contact:            optional
        hazard:             optional
      tree:
        maintainer:         a named person
        built_by:           backcasting from the end state with outside experts
        nodes:              "{id, kind: question | capability | external, label, area, status, who}"
        edges:              "{from, to, kind: requires}"
        reviewed:           date
    checks:
      - an outsider can pick a question and know the first step without talking to us
      - every question says what an answer looks like
      - the tree names its maintainer and its last review date
    failures:
      - questions only we could work on
      - a tree with no external nodes
      - renumbering after a reorganisation

  - id: roadmap
    part: roadmap
    title: "Research Roadmap: <program name>"
    required: the next-90-days table and the go/no-go criteria are required inside the charter. The standalone document is written when the sponsor or a partner needs the sequencing argument.
    reader: the team, the sponsor, close partners
    length: 2 to 3 pages plus cards
    updated: at every review
    sections:
      - {id: path,        title: "Path", prompt: "Our route through the tree: which nodes, in what order, and why this order."}
      - {id: horizons,    title: "Horizons", prompt: "This quarter, this year, longer: what we expect to be true at each."}
      - {id: next,        title: "Next 90 days", prompt: "Table of commitments: what, owner, traced to, test, date."}
      - {id: go_no_go,    title: "Go / no-go", prompt: "Dated criteria written before results exist, and the decision each one unlocks."}
      - {id: untraced,    title: "Untraced work", prompt: "Register: what, why, share of envelope used, number of reviews survived."}
      - {id: risks,       title: "Risks and dependencies", prompt: "Top risks. Dependencies on teams the program does not control."}
      - {id: parked,      title: "Parking lot", prompt: "What we are deliberately not doing now, so nobody has to ask."}
    sub_formats:
      commitment_card:
        id:           short
        statement:    "By DATE we will see Y, measured by M against baseline B."
        owner:        exactly one
        traced_to:    "a question id, or 'untraced'"
        test:         the check that decides it
        judged_by:    "continuation (research) | kill rule (product, arena)"
        status:       "proposed | active | passed | stopped"
        heavier_form: "an optional fuller bet card, not yet specified"
    checks:
      - every commitment has one owner, a date, and a test
      - every commitment cites a question id or is tagged untraced
      - untraced work is within its share of the envelope
    failures:
      - a list of activities with no tests
      - criteria written after the result
      - a path that is just the order things were started

  - id: terms
    part: terms
    title: "Terms: <program name>"
    required: always, inside the charter. Its key lines are repeated in the masthead.
    reader: the sponsor and the team
    length: 1 to 2 pages
    updated: rarely; by the amendment rule it contains
    sections:
      - {id: purpose,     title: "Purpose", prompt: "One sentence. Points to the thesis."}
      - {id: authority,   title: "Sponsor and authority", prompt: "Who signs, who funds, who can end it. What the program may decide on its own. Who approves a version bump."}
      - {id: people,      title: "People", prompt: "Names, roles, time fractions. Investigators named against questions where that is real."}
      - {id: envelope,    title: "Envelope", prompt: "Total resources, not line items. The share reserved for untraced work."}
      - {id: term,        title: "Term and review", prompt: "Start, end date or end condition, the one review cadence."}
      - {id: reporting,   title: "Reporting", prompt: "What the sponsor sees, and how often."}
      - {id: openness,    title: "Openness", prompt: "What is published, what is commercial, who decides, and the default when nobody has decided."}
      - {id: judging,     title: "Judging", prompt: "How research continuation is judged. How product expansion is judged. Kept separate."}
      - {id: endings,     title: "Endings", prompt: "Graduate, hand off, stop: the condition that triggers each."}
      - {id: stewardship, title: "Stewardship", prompt: "Who inherits the space, the open problems, and the tree when the program ends."}
      - {id: amendments,  title: "Amendments", prompt: "How the charter changes, and what forces a new version."}
      - {id: signed,      title: "Signed", prompt: "Names and date."}
    checks:
      - someone outside the team can tell who can stop the program and on what grounds
      - time fractions add up to the people actually available
    failures:
      - authority described as consensus
      - an end condition nobody could observe

  - id: review_note
    part: all
    title: "Review note: <date>"
    required: at every review
    reader: the team and the sponsor
    length: 1 page
    updated: never; it is a record
    sections:
      - {id: learned,     title: "What we learned", prompt: "Results since the last review, each with its evidence."}
      - {id: commitments, title: "Commitments", prompt: "Met, missed, changed. One line each."}
      - {id: decisions,   title: "Go / no-go decisions taken", prompt: "Which criteria came due and what was decided."}
      - {id: upward,      title: "Does anything change a part above?", prompt: "Space, thesis, open problems: yes or no for each, and what. A falsified premise is recorded here."}
      - {id: untraced,    title: "Untraced work", prompt: "New, resolved, and ageing. Anything at its second review gets resolved now."}
      - {id: next,        title: "Next", prompt: "Decisions, owners, next review date, whether the version bumps."}
    checks:
      - took under 90 minutes
      - the "change a part above" question was answered explicitly for each part
    failures:
      - a status update with no decisions

  - id: discovery_summary
    part: before the charter
    title: "Discovery summary: <space>"
    required: optional; written once, before charter v0.1
    reader: whoever will draft the thesis
    length: 2 pages
    updated: never
    sections:
      - {id: tried,       title: "What we tried", prompt: "Workshops, short projects, prototypes, conversations."}
      - {id: artifacts,   title: "What exists", prompt: "Artifacts with links and an honest grade for each."}
      - {id: surprised,   title: "What surprised us", prompt: "The results nobody predicted."}
      - {id: cruxes,      title: "Cruxes it surfaced", prompt: "Disagreements that turned out to matter. These seed the space."}
      - {id: toward,      title: "Toward a thesis", prompt: "The claim the evidence now supports, and what it still does not."}
    checks:
      - at least one surprise is recorded
    failures:
      - a list of events with no findings

  - id: closing_report
    part: after the term
    title: "Closing report: <program name>"
    required: at the end of the term
    reader: the sponsor, the steward, the field
    length: 3 pages
    updated: never
    sections:
      - {id: end_state,   title: "What exists now", prompt: "Against the success-at-end statement and the baseline."}
      - {id: premises,    title: "Premises", prompt: "Held, dropped, or still open. With the evidence."}
      - {id: questions,   title: "Questions", prompt: "Answered, opened, retired."}
      - {id: handover,    title: "Handover", prompt: "What goes to whom: results, the space, the open problems, the tree."}
      - {id: ending,      title: "Which ending", prompt: "Graduate, hand off, or stop, and the condition that triggered it."}
      - {id: again,       title: "What we would do differently", prompt: "About the work, and about this format."}
    checks:
      - a named steward has accepted the handover
    failures:
      - a success story with no dropped premises
